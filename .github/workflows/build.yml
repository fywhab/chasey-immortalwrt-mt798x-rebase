name: Build ImmortalWrt MT7986 (JD Cloud RE-CP-03)

on:
  workflow_dispatch:
    inputs:
      include_luci:
        description: "包含 LuCI 网页管理界面"
        required: false
        default: "true"
        type: boolean

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  DEFCONFIG: defconfig/mt7986-ax6000.config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget curl bc patch perl libelf-dev pkg-config libpython3-dev python3-pyelftools ccache subversion xz-utils zstd jq
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          df -hT

      - name: 克隆源码
        run: |
          df -hT $PWD
          git clone --depth 1 --single-branch --branch $REPO_BRANCH $REPO_URL openwrt

      - name: 加载设备配置 (JD Cloud RE-CP-03 / MT7986 AX6000)
        run: |
          cd openwrt
          cp -f $DEFCONFIG .config
          # 可选：包含 LuCI 网页界面
          if [ "${{ github.event.inputs.include_luci }}" = "true" ]; then
            sed -i 's/# CONFIG_PACKAGE_luci is not set/CONFIG_PACKAGE_luci=y/' .config || true
            grep -q "CONFIG_PACKAGE_luci=" .config || echo "CONFIG_PACKAGE_luci=y" >> .config
          fi
          make defconfig
          grep -E "CONFIG_TARGET_(BOARD|SUBTARGET|DEVICE)" .config | head -10

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: 下载软件包源码
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        continue-on-error: true
        timeout-minutes: 360
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 编译失败时重试（单线程详细日志）
        if: steps.compile.outcome == 'failure'
        timeout-minutes: 360
        run: |
          cd openwrt
          make -j1 V=s

      - name: 检查空间占用
        if: always()
        run: df -hT

      - name: 上传固件 (bin 文件)
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-mt7986-jdcloud-re-cp-03-bin
          path: openwrt/bin/targets/**/*.bin
          retention-days: 30

      - name: 上传完整 targets 目录
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-mt7986-jdcloud-re-cp-03-full
          path: openwrt/bin/targets/
          retention-days: 7
